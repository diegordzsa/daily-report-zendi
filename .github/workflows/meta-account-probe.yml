name: Meta Account Probe

# Temporal y de SOLO LECTURA. Imprime la moneda y la timezone de cada cuenta de
# Meta y de la tienda de Shopify, para decidir como conectar la segunda cuenta
# al reporte diario. NO envia nada a Slack y NO afecta al reporte.
#
# Sirve para cuatro cosas:
#   1. Confirmar que el META_ACCESS_TOKEN alcanza la cuenta nueva.
#   2. Leer la moneda de cada cuenta de Meta.
#   3. Leer la timezone de cada cuenta (define cuando cierra el dia).
#   4. Leer la moneda de Shopify, para saber si el MER mezcla divisas.
#
# Borrar este workflow cuando la segunda cuenta este conectada.

on:
  workflow_dispatch:
    inputs:
      new_ad_account_id:
        description: 'ID numerico de la cuenta nueva (sin el prefijo act_)'
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      CURRENT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      NEW_ID: ${{ github.event.inputs.new_ad_account_id }}
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
    steps:
      - name: Cuentas de Meta — moneda y timezone
        run: |
          probe_account () {
            label="$1"
            id="$2"
            echo "=================================================="
            echo "  ${label}  (act_${id})"
            echo "=================================================="
            curl -s -G "https://graph.facebook.com/v21.0/act_${id}" \
              --data-urlencode "access_token=${META_ACCESS_TOKEN}" \
              --data-urlencode "fields=name,timezone_name,currency,account_status" \
              | jq '.'
            echo
          }

          probe_account "CUENTA ACTUAL" "${CURRENT_ID}"
          probe_account "CUENTA NUEVA"  "${NEW_ID}"

      - name: Shopify — moneda de la tienda
        run: |
          echo "=================================================="
          echo "  SHOPIFY — tienda"
          echo "=================================================="
          # `currency` es la moneda en que la tienda liquida y en la que vienen
          # los importes de la Admin API, que es lo que el reporte suma.
          # El `else .` deja ver el error crudo si la llamada falla.
          curl -s "https://${SHOPIFY_STORE_DOMAIN}/admin/api/2024-10/shop.json" \
            -H "X-Shopify-Access-Token: ${SHOPIFY_ACCESS_TOKEN}" \
            | jq 'if .shop then {name: .shop.name, currency: .shop.currency, money_format: .shop.money_format, iana_timezone: .shop.iana_timezone} else . end'
          echo

      - name: Shopify — moneda real de unas ordenes
        run: |
          echo "=================================================="
          echo "  SHOPIFY — ultimas 3 ordenes"
          echo "=================================================="
          # Confirmacion independiente: el campo `currency` de ordenes reales.
          # Manda este, porque `subtotal_price` + `total_tax` es exactamente lo
          # que report.js suma en `order_net_sales`.
          curl -s -G "https://${SHOPIFY_STORE_DOMAIN}/admin/api/2024-10/orders.json" \
            -H "X-Shopify-Access-Token: ${SHOPIFY_ACCESS_TOKEN}" \
            --data-urlencode "status=any" \
            --data-urlencode "limit=3" \
            --data-urlencode "fields=id,created_at,currency,total_price,subtotal_price,total_tax" \
            | jq 'if .orders then [.orders[] | {created_at, currency, subtotal_price, total_tax, total_price}] else . end'

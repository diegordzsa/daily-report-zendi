name: Meta Account Probe

# Temporal y de SOLO LECTURA. Imprime nombre, timezone, moneda y una muestra de
# gasto de las dos cuentas de Meta, para decidir como conectar la segunda al
# reporte diario. NO envia nada a Slack y NO afecta al reporte.
#
# Sirve para tres cosas a la vez:
#   1. Confirmar que el META_ACCESS_TOKEN actual tambien alcanza la cuenta nueva.
#   2. Leer la moneda de cada cuenta (si difieren, sumar el gasto seria falso).
#   3. Leer la timezone de cada cuenta (define cuando cierra el dia y por tanto
#      cuando el gasto esta consolidado).
#
# Borrar este workflow cuando la segunda cuenta este conectada.

on:
  workflow_dispatch:
    inputs:
      new_ad_account_id:
        description: 'ID numerico de la cuenta nueva (sin el prefijo act_)'
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      CURRENT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      NEW_ID: ${{ github.event.inputs.new_ad_account_id }}
    steps:
      - name: Metadatos y muestra de gasto de ambas cuentas
        run: |
          YESTERDAY=$(date -u -d 'yesterday' +%F)
          echo "Dia de muestra: ${YESTERDAY}"
          echo

          probe_account () {
            label="$1"
            id="$2"
            echo "=================================================="
            echo "  ${label}  (act_${id})"
            echo "=================================================="

            echo "--- Metadatos de la cuenta ---"
            curl -s -G "https://graph.facebook.com/v21.0/act_${id}" \
              --data-urlencode "access_token=${META_ACCESS_TOKEN}" \
              --data-urlencode "fields=name,timezone_name,timezone_offset_hours_utc,currency,account_status" \
              | jq '.'

            echo "--- Insights de ${YESTERDAY} ---"
            curl -s -G "https://graph.facebook.com/v21.0/act_${id}/insights" \
              --data-urlencode "access_token=${META_ACCESS_TOKEN}" \
              --data-urlencode "time_range={\"since\":\"${YESTERDAY}\",\"until\":\"${YESTERDAY}\"}" \
              --data-urlencode "level=account" \
              --data-urlencode "fields=spend,impressions,clicks,actions,action_values" \
              | jq '.'
            echo
          }

          probe_account "CUENTA ACTUAL" "${CURRENT_ID}"
          probe_account "CUENTA NUEVA"  "${NEW_ID}"

name: Daily Report

# El disparo lo hace un cron externo (cron-job.org) via workflow_dispatch, no el
# scheduler de GitHub: sus crons se retrasan entre 2 h y 3 h 45 min de forma
# impredecible, y ese jitter movia la hora de entrega y la frescura del dato de
# Meta cada dia. Ver SETUP.md > "Disparo externo".
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Override report date (YYYY-MM-DD). Leave empty for yesterday.'
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run daily report
        env:
          # --- Requeridas (configurar en Settings > Secrets) ---
          STORE_NAME: ${{ secrets.STORE_NAME }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          # --- Opcionales ---
          # Cuentas de Meta que se suman en el reporte (con desglose por cuenta).
          # Deben estar en la misma moneda: si no, el reporte no se publica.
          META_AD_ACCOUNTS: '[{"id":"${{ secrets.META_AD_ACCOUNT_ID }}","label":"MX 1"},{"id":"1823395738216717","label":"MX 2"}]'
          # Zendi MX 1 cierra el dia a las 00:00 America/Mexico_City = 06:00 UTC =
          # 08:00 Madrid. Con varias cuentas manda la que cierra mas tarde (la
          # timezone real se lee de la API; esta es solo el fallback). Por debajo de
          # MIN_HOURS_AFTER_CLOSE el gasto todavia no esta consolidado y el reporte
          # no se publica.
          META_ACCOUNT_TIMEZONE: 'America/Mexico_City'
          MIN_HOURS_AFTER_CLOSE: '3'
          REPORT_TIME_LABEL: '11:00 (Madrid)'
          STORE_LOCALE: 'es-MX'
          STORE_INDUSTRY: 'suplementos DTC'
          ROAS_BENCHMARK: '2.0x-4.0x'
          SUBSCRIPTION_TAGS: '[{"tag":"Kaching Subscription First Order","label":"1ª Susc"},{"tag":"Kaching Subscription Recurring Order","label":"Recurrentes"}]'
          REPORT_DATE: ${{ github.event.inputs.report_date }}
        run: node src/report.js
